[home]
title = { en = "Guewen Heslan — Economist", fr = "Guewen Heslan — Économiste" }
description = { en = "Guewen Heslan, PhD candidate in economics (LEMNA, Nantes Université) and ATER at Université Paris Cité. Trade, environmental policy and maritime transport.", fr = "Guewen Heslan, doctorant en économie (LEMNA, Nantes Université) et ATER à l’Université Paris Cité. Commerce international, politique environnementale et transport maritime." }

positions.en = [
  "PhD candidate in Economics, LEMNA — Nantes Université",
  "Temporary Teaching and Research Assistant (ATER), Université Paris Cité",
]
positions.fr = [
  "Doctorant en économie, LEMNA — Nantes Université",
  "Attaché temporaire d’enseignement et de recherche (ATER), Université Paris Cité",
]

lead.en = "I study how environmental policy reshapes trade flows and logistics networks — the economic mechanisms that translate regulation into the real-world movement of goods and capital."
lead.fr = "J’étudie comment les politiques environnementales transforment les flux commerciaux et les réseaux logistiques — les mécanismes économiques qui traduisent la réglementation en mouvements concrets de biens et de capitaux."

bio.en = "My doctoral research, at LEMNA (Nantes Université) in collaboration with LHEEA (Centrale Nantes), combines structural gravity models of trade with fleet and freight optimization models to study how carbon pricing and environmental regulation affect maritime trade and the decarbonization strategies of shipping companies. I am supervised by Rodica Loisel, Corinne Bagoulla and Pierre Marty."
bio.fr = "Ma thèse, menée au LEMNA (Nantes Université) en collaboration avec le LHEEA (Centrale Nantes), associe des modèles de gravité structurels du commerce à des modèles d’optimisation de flotte et de fret, afin d’étudier comment la tarification du carbone et la réglementation environnementale affectent le commerce maritime et les stratégies de décarbonation des armateurs. Elle est dirigée par Rodica Loisel, Corinne Bagoulla et Pierre Marty."

interests.en = ["international trade", "environmental and energy economics", "maritime transport", "carbon pricing"]
interests.fr = ["commerce international", "économie de l’environnement et de l’énergie", "transport maritime", "tarification du carbone"]

